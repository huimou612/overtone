name: Build

on:
  push:
    branches:
      - master
  # 支持在 Actions 页面手动触发一次完整打包，便于不打标签也能验证构建
  workflow_dispatch:

# 打包流程要用 GITHUB_TOKEN 创建 Release 并上传各平台安装包。
# 本仓库由 API 创建，默认工作流权限为 read，缺少此项会在「Release」步骤
# 报 403 Resource not accessible by integration。显式声明可不受仓库默认设置影响。
permissions:
  contents: write

# 同一分支上后一次推送取消前一次未完成的构建，避免白烧 CI 时长。
# 注意：Release 是流水线的最后一步，被取消的构建不会留下半成品草稿。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: 'true'

jobs:
  # CheckCode:
  #   name: Lint Code
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out git repository
  #       uses: actions/checkout@v6

  #     - name: Install Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20

  #     - name: Cache file
  #       uses: actions/cache@v4
  #       with:
  #         path: |
  #           node_modules
  #           $HOME/.cache/electron
  #           $HOME/.cache/electron-builder
  #           $HOME/.npm/_prebuilds
  #         key: ${{ runner.os }}-build-caches-${{ hashFiles('**/package-lock.json') }}
  #         restore-keys: |
  #           ${{ runner.os }}-build-

  # ─────────────────────────────────────────────────────────────────────────
  # 各平台 job 只负责「编译 + 打包」，不再自行发布 Release。
  #
  # 为什么这么改：以前这里直接跑 publish:*（electron-builder publish=always），
  # 4 个 job 并行去创建同一个 tag 的 draft release。draft 不占 git tag，各 job
  # 互相查不到对方，于是每推一次代码就多出 2–4 份重复草稿（实测一次 1.5 GB）。
  # 现在改为各平台上传 artifact，由末尾唯一的 Release job 汇总发布，彻底消除竞态。
  #
  # 对应的无发布脚本：publish:xxx → pack:xxx（build-pack.js 里 publish 默认为 'never'）
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  # 发布守卫：绝不去动「已发布」版本的 tag。
  #
  # 背景：本工作流由 push 到 master 触发，而 tag 名是用 package.json 的 version
  # 拼出来的。一旦某个版本已经 Publish（不再是 draft），再推一个同版本号的提交，
  # Release job 就会去删 refs/tags/v$VERSION —— 而那个 tag 是已发布 release 的
  # 锚点：删掉它会让 release 变成孤儿，Release job 自己也会失败，四平台全部白跑
  # （实测 v0.1.0 发布后就是这个状态）。
  #
  # 所以这里先用 ~10 秒查一次：版本号对应的 release 若已是已发布状态，整个工作流
  # 直接跳过，只留一条 notice 提示「要发新版请先改 package.json 的 version」。
  # 顺带的好处：纯文档提交不会触发四平台打包（若仓库为私有，这一步省下的是真金
  # 白银的 CI 额度 —— 私有仓库四平台打包一次约 100~137 计费分钟）。
  # ─────────────────────────────────────────────────────────────────────────
  Guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Check whether this version is already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          # 取不到（404）说明这个 tag 还没有 release，可以建；
          # 取到 true 说明只是草稿，也可以覆盖；取到 false 就是已发布 —— 必须让路。
          DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.draft' 2>/dev/null || echo none)

          if [ "$DRAFT" = "false" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过四平台打包::${TAG} 已是「已发布」状态（不是草稿）。要发布新版本，请先修改 package.json 的 version 再推送。"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

          echo "package.json 版本 = ${VERSION}，同 tag release 的 draft 状态 = ${DRAFT}"

  Windows:
    name: Windows
    needs: Guard
    if: needs.Guard.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Package (setup + green)
        run: |
          npm run pack:win:setup:x64
          npm run pack:win:setup:arm64
          npm run pack:win:7z:x64
          npm run pack:win:7z:arm64

      - name: Generate file MD5
        shell: pwsh
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          if-no-files-found: error
          # 只留 1 天。四个平台的包合计约 1.5 GB，而 Free 套餐的**工件存储**额度
          # 只有 500 MB（超出部分 $0.25/GB/月，保留期默认 90 天 —— 实测攒到
          # 17.66 GB）。成功路径由 Release job 建完 release 后立刻删除；这里只
          # 兜住「构建失败 / 被取消」留下的残卷。
          retention-days: 1
          path: |
            build/*.exe
            build/*.exe.blockmap
            build/*.7z
            build/latest.yml

  Windows_7:
    name: Windows_7
    needs: Guard
    if: needs.Guard.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22 better-sqlite3@12
          pip.exe install setuptools

      - name: Package win7 (setup + green)
        run: |
          npm run pack:win7:setup:x64
          npm run pack:win7:7z:x64
          npm run pack:win7:7z:x86

      - name: Generate file MD5
        shell: pwsh
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows7
          if-no-files-found: error
          # 见 packages-windows 处的说明：省工件存储额度
          retention-days: 1
          path: |
            build/*.exe
            build/*.exe.blockmap
            build/*.7z

  Mac:
    name: Mac
    needs: Guard
    if: needs.Guard.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install python3 setuptools
        run: brew install python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Package (dmg x64 + arm64)
        run: |
          npm run pack:mac:dmg
          npm run pack:mac:dmg:arm64

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          if-no-files-found: error
          # 见 packages-windows 处的说明：省工件存储额度
          retention-days: 1
          path: |
            build/*.dmg
            build/*.dmg.blockmap
            build/latest-mac.yml

  Linux:
    name: Linux
    needs: Guard
    if: needs.Guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Package (deb + appImage + rpm + pacman)
        run: |
          npm run pack:linux:deb:amd64
          npm run pack:linux:deb:arm64
          npm run pack:linux:deb:armv7l
          npm run pack:linux:appImage
          npm run pack:linux:rpm
          npm run pack:linux:pacman

      - name: Generate file MD5
        run: |
          cd build
          md5sum *.deb *.rpm *.pacman *.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          if-no-files-found: error
          # 见 packages-windows 处的说明：省工件存储额度
          retention-days: 1
          path: |
            build/*.deb
            build/*.rpm
            build/*.pacman
            build/*.AppImage
            build/latest-linux.yml

  # ─────────────────────────────────────────────────────────────────────────
  # 汇总发布：四个平台全部成功后才跑，只创建一个 draft release
  # ─────────────────────────────────────────────────────────────────────────
  Release:
    name: Release
    needs: [Windows, Windows_7, Mac, Linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files to be published
        run: ls -lh artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          REPO="${GITHUB_REPOSITORY}"
          echo "::notice title=Release tag::${TAG}"

          # 清掉同 tag 的历史草稿：早期版本的工作流会让 4 个平台 job 各建一个
          # 同名草稿，草稿不占 git tag、互相看不见，留着只会白占仓库空间。
          gh api "repos/${REPO}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id" \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/${REPO}/releases/${id}" \
                  && echo "deleted stale draft release id=${id}"
              done

          # 同时清掉可能残留的 git tag，让本次构建的 tag 指向当次提交。
          # ⚠️ 只能在「这个 tag 没有已发布 release」时删 —— 否则会把已发布 release 的
          # 锚点删掉，让它变成孤儿。Guard job 已经把这种情况挡在前面了，这里是第二道保险。
          PUB=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.draft' 2>/dev/null || echo none)
          if [ "$PUB" = "false" ]; then
            echo "::warning title=保留 tag::${TAG} 有已发布的 release，不删 tag，也不新建草稿"
          else
            gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" 2>/dev/null \
              && echo "deleted stale tag ${TAG}" || true
          fi

          {
            echo "由 GitHub Actions 自动构建，提交 \`${GITHUB_SHA:0:8}\`。"
            echo
            echo "**这是草稿（draft），仅供内部验证，尚未对外发布。**"
            echo
            echo "包含平台：Windows / Windows 7 / macOS / Linux。"
            echo "macOS 与 Linux 包未签名，安装时请自行放行。"
          } > /tmp/release-notes.md

          gh release create "${TAG}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "泛音 ${TAG}" \
            --notes-file /tmp/release-notes.md \
            artifacts/*

          echo "::notice title=Draft release created::${TAG}"

      # 发布完成即删掉本次的中间产物。
      #
      # 为什么不靠 retention-days 兜底：四个平台的包一次合计约 1.5 GB，而 Free 套餐的
      # **工件存储**额度只有 500 MB（超出 $0.25/GB/月）—— 留一天就已经超了。安装包此刻
      # 已经作为 **release 资产**上传（那一份不占 Actions 工件存储），中间产物没有保留价值。
      #
      # 刻意放在最后一步：前面任何一步失败这一步都不会执行（没有 if: always()），
      # 失败构建的产物仍按 retention-days: 1 留着排查。
      - name: Clean up intermediate artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id)\t\(.name)"' \
            | while IFS=$'\t' read -r id name; do
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
                  && echo "deleted artifact ${name} (id=${id})"
              done
          echo "::notice title=已清理中间产物::安装包已作为 release 资产保留，中间 artifact 已删除以节省存储额度"
